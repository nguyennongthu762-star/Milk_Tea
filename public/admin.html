<!doctype html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quản trị · MilkTeaShop</title><link rel="stylesheet" href="/style.css"></head><body><header><a class="brand" href="/">MilkTeaShop<span>Quản trị cửa hàng</span></a><nav><a href="/">Về cửa hàng</a><button id="logout" class="secondary" hidden>Đăng xuất</button></nav></header><main><h1>Quản trị cửa hàng</h1><p id="admin-message" role="status" aria-live="polite"></p><section id="login-panel" class="panel login"><h2>Đăng nhập quản trị</h2><form id="login"><label>Tên đăng nhập<input name="username" autocomplete="username" required minlength="3" maxlength="80"></label><label>Mật khẩu<input name="password" type="password" autocomplete="current-password" required maxlength="200"></label><button type="submit">Đăng nhập</button></form></section>
<div id="dashboard" hidden><nav class="tabs"><button id="show-products">Sản phẩm</button><button id="show-orders">Đơn hàng</button></nav><section id="products-panel"><div class="section-title"><h2>Quản lý sản phẩm</h2><button id="new-product">Thêm sản phẩm</button></div><form id="product-form" class="panel" hidden><h3 id="product-title">Thêm sản phẩm</h3><input name="Id" type="hidden"><label>Tên món<input name="Name" required maxlength="120"></label><label>Giá (VNĐ)<input name="Price" type="number" required min="0" max="10000000" step="1"></label><input name="ImageUrl" type="hidden"><div class="image-picker"><label for="product-image">Ảnh sản phẩm</label><div id="image-drop" class="image-drop"><p>Kéo ảnh từ thư mục vào đây</p><p class="muted">hoặc chọn ảnh trên máy · JPEG, PNG, WebP · tối đa 5 MB</p><input id="product-image" type="file" accept="image/jpeg,image/png,image/webp"><button id="choose-image" type="button" class="secondary">Chọn ảnh</button></div><img id="image-preview" class="image-preview" alt="Ảnh sản phẩm đã chọn" hidden><p id="image-message" role="status" aria-live="polite"></p><button id="remove-image" type="button" class="secondary" hidden>Bỏ ảnh</button></div><label>Mô tả<textarea name="Description" maxlength="1000" rows="3"></textarea></label><label class="checkbox"><input name="IsActive" type="checkbox" checked> Đang bán</label><button type="submit">Lưu sản phẩm</button><button id="cancel-product" type="button" class="secondary">Đóng</button></form><div id="admin-products" class="product-grid"></div></section>
<section id="orders-panel" hidden><h2>Quản lý đơn hàng</h2><label>Lọc trạng thái<select id="order-filter"><option value="">Tất cả</option><option value="pending">Chờ xác nhận</option><option value="confirmed">Đã xác nhận</option><option value="shipping">Đang giao</option><option value="completed">Hoàn thành</option><option value="cancelled">Đã hủy</option></select></label><button id="refresh-orders" class="secondary">Tải lại</button><div id="admin-orders"></div><div class="pagination"><button id="prev-page" class="secondary">Trang trước</button><span id="page-label"></span><button id="next-page" class="secondary">Trang sau</button></div><section id="order-detail" class="panel" hidden></section></section></div></main><script type="module" src="/admin.js"></script></body></html>
